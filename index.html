<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d6b55">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>生活記錄</title>
<style>
:root{--bg:#f6f6f3;--cd:#fff;--tx:#1d1d1b;--mu:#6b6b66;--ac:#1d6b55;--on:#fff;--bd:#dcdcd5;--bad:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--cd:#222221;--tx:#ececea;--mu:#9a9a94;--ac:#5bbf9f;--on:#10231d;--bd:#3a3a38;--bad:#f2b8b5;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif}
header{display:flex;flex-direction:column;padding:12px 16px 0;max-width:640px;margin:auto}
h1{font-size:20px;margin:0}#st{font-size:12px;color:var(--mu)}
nav{display:flex;gap:6px;padding:10px 16px;max-width:640px;margin:auto;position:sticky;top:0;background:var(--bg);z-index:5}
nav button{flex:1;padding:9px 0;border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:10px;font:inherit}
nav button.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
main{max-width:640px;margin:auto;padding:0 16px 40px}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:15px;margin:0 0 10px}label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--tx);font:inherit}
.r{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{padding:10px 14px;border:0;border-radius:10px;background:var(--ac);color:var(--on);font:inherit;margin-top:10px}
.btn.g{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.x{background:none;border:0;color:var(--bad);font:inherit;padding:4px 8px}
.it{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid var(--bd);font-size:14px}
.mu{color:var(--mu);font-size:13px}.sec{display:none}.sec.on{display:block}
textarea{min-height:120px;font:12px/1.4 ui-monospace,monospace}
code{font-size:12px;word-break:break-all}
.ax{fill:var(--mu);font-size:11px}.gl{stroke:var(--bd)}.lg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mu);margin-top:4px}.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}table.rk{width:100%;border-collapse:collapse;font-size:13px}table.rk td{padding:4px 2px;border-top:1px solid var(--bd)}table.rk td:nth-child(n+3){text-align:right}
nav button{font-size:14px}
</style>
</head>
<body>
<header><h1>生活記錄</h1><span id="st">載入中…</span></header>
<nav><button data-t="in" class="on">輸入</button><button data-t="hi">歷史</button><button data-t="se">設定</button><button data-t="ch">圖表</button><button data-t="ba">備份同步</button></nav>
<main>
<section id="in" class="sec on"></section>
<section id="hi" class="sec"></section>
<section id="se" class="sec"></section>
<section id="ch" class="sec"></section>
<section id="ba" class="sec"></section>
</main>
<script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,"0");
const fmt=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const addD=(s,n)=>{const d=new Date(s+"T00:00:00");d.setDate(d.getDate()+n);return fmt(d)};
const TODAY=fmt(new Date()),YDAY=addD(TODAY,-1);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const IDB=(()=>{let p;const open=()=>p||(p=new Promise((res,rej)=>{const r=indexedDB.open("lifeledger",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
 const tx=async(m,f)=>{const d=await open();return new Promise((res,rej)=>{const t=d.transaction("kv",m);let q;try{q=f(t.objectStore("kv"))}catch(e){rej(e);return}t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})};
 return{get:k=>tx("readonly",s=>s.get(k)),set:(k,v)=>tx("readwrite",s=>s.put(v,k))}})();
const DEF={cur:["HKD","JPY","CNY","TWD","KRW","USD"],pay:["現金","信用卡/銀行扣款","PayPay","樂天Pay(積分)","IC卡","匯豐扣賬卡"],
items:[{id:"weight",n:"體重",t:"num",u:"kg",w:"t"},{id:"act",n:"行動指數(共同活動次數)",t:"int",u:"",w:"y"},{id:"cig",n:"吸煙枝數",t:"int",u:"枝",w:"y"},{id:"drk",n:"有否飲酒",t:"yn",u:"",w:"y"},{id:"stp",n:"步行步數",t:"int",u:"步",w:"y"},{id:"rnk",n:"全球步數排名",t:"int",u:"",w:"y"}]};
const SEED=[["譚仔三哥米線",78,"JPY","信用卡/銀行扣款",null,"外食及飲品",""],["駐車場",63,"JPY","現金",null,"車用支出","駐車場"],["高速道路料金",57,"JPY","信用卡/銀行扣款",null,"車用支出","高速道路料金"],["肉のハナマサ",56,"JPY","信用卡/銀行扣款",null,"食品雜貨",""],["業務スーパー",47,"JPY","信用卡/銀行扣款",null,"食品雜貨",""],["Amazon",42,"JPY","信用卡/銀行扣款",null,"購物及日用品",""],["ひまわり青果",37,"JPY","PayPay",null,"食品雜貨",""],["オーケー",35,"JPY","信用卡/銀行扣款",null,"食品雜貨",""],["サミット",31,"JPY","信用卡/銀行扣款",null,"食品雜貨",""],["Daiso",28,"JPY","信用卡/銀行扣款",null,"購物及日用品",""],["ニキ先生",28,"JPY","PayPay",3000,"教育及學習",""],["現金回贈",27,"JPY","匯豐扣賬卡",null,"金融及稅務","現金回贈"],["Suicaカード",26,"JPY","信用卡/銀行扣款",null,"交通","Suicaカード"],["まいばすけっと",23,"JPY","信用卡/銀行扣款",null,"食品雜貨",""],["セフンーイレブン",21,"JPY","信用卡/銀行扣款",null,"食品雜貨",""],["Tata",19,"JPY","信用卡/銀行扣款",null,"收入及退款","","r"],["コスモ",19,"JPY","信用卡/銀行扣款",null,"車用支出","ガソリン"],["ドン・キホーテ",17,"JPY","信用卡/銀行扣款",null,"購物及日用品",""],["三代目茂蔵",16,"JPY","現金",null,"外食及飲品",""],["京和商店",13,"JPY","PayPay",null,"食品雜貨",""]];
const DEFCATS=[{n:"食品雜貨"},{n:"外食及飲品"},{n:"飲酒"},{n:"煙"},{n:"交通",s:["八達通","Suicaカード","Pasmoカード","タクシー","バス","その他"]},{n:"車用支出",s:["ガソリン","駐車場","高速道路料金","トンネル","その他"]},{n:"居住支出",s:["管理費","水道局","電気代","ガス代","差餉","家賃","住宅ローン","その他"]},{n:"通訊及網絡"},{n:"醫療保健"},{n:"保險"},{n:"教育及學習"},{n:"捐款"},{n:"娛樂及閱讀"},{n:"購物及日用品"},{n:"旅行",s:["航空券","ホテル","ビザ","両替","その他"]},{n:"家人及轉帳"},{n:"金融及稅務",s:["現金回贈","利息","その他"]},{n:"收入及退款"},{n:"個人護理"},{n:"家務及人工"}];
const TT={"":"—",x:"公務(可報銷)",r:"公司退回"};
const calc=(t,T)=>{t=String(t||"").trim().replace(/[Tt總]/g,"("+T+")");if(!t)return 0;if(!/^[0-9+\-*/().\s]+$/.test(t))return NaN;try{const v=Function('"use strict";return ('+t+')')();return isFinite(v)?Math.round(v*100)/100:NaN}catch(e){return NaN}};
const parts=e=>{const o=[],sp=e.sp||{};let m=e.a;for(const k in sp)if(sp[k]>0){o.push({g:k,a:sp[k]});m-=sp[k]}o.push({g:e.g||"",a:m});return o};
const gSum=(es,g)=>{const o={};es.forEach(e=>{if(e.k===false||e.a<=0)return;parts(e).forEach(p=>{if(p.g===g)o[e.c]=(o[e.c]||0)+p.a})});return o};
const gTxt=o=>{const k=Object.keys(o);return k.length?k.map(c=>c+" "+o[c].toLocaleString(undefined,{maximumFractionDigits:2})).join(" / "):"—"};
let cfg=null,M={},idx=[],FQ={},ed=YDAY,lastCur="JPY",lastPay="現金",busy=false,timer=null,dp=null,ei=null;
const msg=t=>{$("#st").textContent=t};
const ld=k=>IDB.get(k),sv=(k,o)=>IDB.set(k,o),mk=d=>"m"+d.slice(0,7);
async function gm(d){const k=mk(d);if(!M[k])M[k]=await ld(k)||{days:{}};return M[k]}
async function gd(d){const m=await gm(d);return m.days[d]||(m.days[d]={v:{},e:[]})}
async function sm(d){const k=mk(d);M[k]._ts=Date.now();if(!idx.includes(k)){idx.push(k);await sv("idx",{list:idx})}await sv(k,M[k]);sched()}
async function scfg(){cfg._ts=Date.now();await sv("cfg",cfg);sched()}
function fav(){const m={};SEED.forEach(x=>m[x[0]]={n:x[1],c:x[2],p:x[3],a:x[4],g:x[5],s:x[6],tt:x[7]||""});Object.entries(FQ).forEach(([k,v])=>m[k]=Object.assign({},m[k],v));return Object.entries(m).sort((a,b)=>b[1].n-a[1].n).slice(0,20)}
const chips=()=>fav().map(([k])=>`<button class="btn g" style="margin:3px 3px 0 0;padding:6px 10px;font-size:14px" data-ch="${esc(k)}">${esc(k)}</button>`).join("");
const catOpts=sel=>`<option value="">—</option>`+cfg.cats.map(c=>`<option${c.n===sel?" selected":""}>${esc(c.n)}</option>`).join("");
const subOpts=(cat,sel)=>{const c=cfg.cats.find(x=>x.n===cat);return c&&c.s&&c.s.length?`<option value="">—</option>`+c.s.map(x=>`<option${x===sel?" selected":""}>${esc(x)}</option>`).join(""):`<option value="">(無子分類)</option>`};
function pick(k){const f=fav().find(x=>x[0]===k);if(!f)return;const v=f[1];$("#en").value=k;if(v.c&&cfg.cur.includes(v.c))$("#ec").value=v.c;if(v.p&&cfg.pay.includes(v.p))$("#ep").value=v.p;$("#ea").value=v.a!=null?v.a:"";
 $("#eg").value=v.g||"";$("#es").innerHTML=subOpts(v.g||"",v.s||"");$("#etx").value=v.tt||"";$("#ea").focus()}
function bump(n,a,c,p,g,s,tt){const o=FQ[n]||{},b=(SEED.find(x=>x[0]===n)||[])[1]||0;FQ[n]={n:(o.n||b)+1,c,p,g,s,tt:tt||"",la:a,a:o.la===a?a:null}}
function tot(e){const o={};e.forEach(x=>{if(x.k!==false)o[x.c]=(o[x.c]||0)+x.a});return Object.entries(o).map(([c,a])=>c+" "+a.toLocaleString(undefined,{maximumFractionDigits:2})).join(" / ")||"—"}
function fld(it,val){const id="f_"+it.id,v=val==null?"":val;
 if(it.t==="yn")return`<select id="${id}"><option value="">—</option><option value="Y"${v==="Y"?" selected":""}>有</option><option value="N"${v==="N"?" selected":""}>沒有</option></select>`;
 return`<input id="${id}" type="number" inputmode="${it.t==="int"?"numeric":"decimal"}" step="${it.t==="int"?1:0.1}" value="${esc(v)}">`}
const ttSum=es=>{const o={};es.forEach(x=>{if(!x.tt)return;const m=o[x.c]||(o[x.c]={x:0,r:0});m[x.tt]+=Math.abs(x.a)});return o};
const ttTxt=o=>{const k=Object.keys(o);return k.length?k.map(c=>`${c} 公務 ${o[c].x.toLocaleString(undefined,{maximumFractionDigits:2})} / 退回 ${o[c].r.toLocaleString(undefined,{maximumFractionDigits:2})} / 未退回 ${(o[c].x-o[c].r).toLocaleString(undefined,{maximumFractionDigits:2})}`).join("<br>"):"沒有記錄"};
async function rIn(){
 const wd=addD(ed,1)>TODAY?TODAY:addD(ed,1),dY=await gd(ed),dT=await gd(wd),it=cfg.items.filter(i=>!i.off),E=ei!=null&&dY.e[ei]?dY.e[ei]:null;
 const rows=it.map(i=>{const d=i.w==="t"?dT:dY;return`<label>${esc(i.n)}${i.u?"("+esc(i.u)+")":""} <span class="mu">${i.w==="t"?"記在 "+wd:ed}</span></label>${fld(i,d.v[i.id])}`}).join("");
 const ex=dY.e.map((x,n)=>`<div class="it"><span>${esc(x.n)}${x.p?` <span class="mu">${esc(x.p)}</span>`:""}<br><span class="mu">${esc([x.g,x.s].filter(Boolean).join(" › "))}${x.t?" #"+esc(x.t):""}${x.tt?" ・"+TT[x.tt]:""}${x.sp?" ・其中 "+Object.entries(x.sp).map(([k,v])=>k+" "+v.toLocaleString()).join("、"):""}${x.k===false?" ・不計入合計":""}</span></span><span style="text-align:right">${x.a.toLocaleString()} ${esc(x.c)}<br><button class="x" data-tt="${n}">${x.tt==="x"?"取消公務":"標記公務"}</button><button class="x" data-ex="${n}">編輯</button><button class="x" data-del="${n}">刪除</button></span></div>`).join("");
 const ev=E||{},ecur=ev.c||lastCur,epay=ev.p!=null?ev.p:lastPay;
 $("#in").innerHTML=`<div class="cd"><h2>日期(預設昨天)</h2><input type="date" id="ed" value="${ed}" max="${TODAY}"></div>
 <div class="cd"><h2>每日項目</h2>${rows}<button class="btn" id="sdv">儲存每日項目</button></div>
 <div class="cd"><h2>${E?"編輯支出":"支出"}</h2>${E?"":`<div>${chips()}</div>`}<label>項目</label><input id="en" value="${esc(ev.n||"")}" placeholder="可自由輸入,或點上面的常用項目">
 <div class="r"><div><label>金額</label><input id="ea" type="number" inputmode="decimal" step="any" value="${E?Math.abs(E.a):""}"></div><div><label>幣種</label><select id="ec">${cfg.cur.map(c=>`<option${c===ecur?" selected":""}>${esc(c)}</option>`).join("")}</select></div></div>
 <div class="r"><div><label>付款方式</label><select id="ep"><option value="">—</option>${cfg.pay.map(p=>`<option${p===epay?" selected":""}>${esc(p)}</option>`).join("")}</select></div><div><label>分類</label><select id="eg">${catOpts(ev.g||"")}</select></div></div>
 <div class="r"><div><label>子分類</label><select id="es">${subOpts(ev.g||"",ev.s||"")}</select></div><div><label>標籤(可留空)</label><input id="et" value="${esc(ev.t||"")}"></div></div>
 <label>Tata(公司報銷)</label><select id="etx"><option value="">—</option><option value="x"${ev.tt==="x"?" selected":""}>公務支出(可報銷)</option><option value="r"${ev.tt==="r"?" selected":""}>公司退回(輸入正數)</option></select>
 <div class="r"><div><label>其中飲酒金額(可輸入算式,T=總額)</label><input id="ew" value="${E&&E.sp&&E.sp["飲酒"]?E.sp["飲酒"]:""}" placeholder="例如 T-1344-107"></div><div><label>其中煙金額</label><input id="esk" value="${E&&E.sp&&E.sp["煙"]?E.sp["煙"]:""}" placeholder="例如 580"></div></div>
 <label><input type="checkbox" id="ek" ${E&&E.k===false?"":"checked"} style="width:auto"> 計入每日合計</label><button class="btn" id="aex">${E?"更新支出":"加入支出"}</button>${E?` <button class="btn g" id="cex">取消編輯</button>`:""}</div>
 <div class="cd"><h2>${ed} 的支出</h2>${ex||'<span class="mu">還沒有記錄</span>'}<div class="it"><b>合計</b><b>${esc(tot(dY.e))}</b></div></div>`;
 $("#ed").onchange=e=>{ed=e.target.value||YDAY;ei=null;rIn()};document.querySelectorAll("[data-ch]").forEach(b=>b.onclick=()=>pick(b.dataset.ch));
 $("#eg").onchange=()=>{$("#es").innerHTML=subOpts($("#eg").value,"")};
 $("#sdv").onclick=async()=>{for(const i of it){const d=i.w==="t"?dT:dY,v=$("#f_"+i.id).value;
   if(v==="")delete d.v[i.id];else d.v[i.id]=i.t==="yn"?v:Number(v)}
   await sm(ed);await sm(wd);$("#sdv").textContent="已儲存 ✓";setTimeout(()=>$("#sdv")&&($("#sdv").textContent="儲存每日項目"),1500)};
 $("#aex").onclick=async()=>{const n=$("#en").value.trim();let a=parseFloat($("#ea").value);if(!n||isNaN(a))return;
   lastCur=$("#ec").value;lastPay=$("#ep").value;const p=lastPay,tt=$("#etx").value,g=$("#eg").value,s=$("#es").value,k=$("#ek").checked&&p!=="樂天Pay(積分)";
   if(tt==="r")a=-Math.abs(a);const en={n,a,c:lastCur,p,g,s,t:$("#et").value.trim(),k};if(tt)en.tt=tt;
   if(a>0){const w=calc($("#ew").value,a),sk=calc($("#esk").value,a);
    if(isNaN(w)||isNaN(sk)||w<0||sk<0){msg("⚠ 酒類或煙的金額算式不正確");return}
    if(w+sk>a+0.005){msg("⚠ 酒類加煙的金額不能大於總額");return}
    if(w>0||sk>0){en.sp={};if(w>0)en.sp["飲酒"]=w;if(sk>0)en.sp["煙"]=sk}}
   if(E){const o=dY.e[ei];if(o.z)en.z=o.z;if(o.tv!=null){en.tv=o.tv;en.tc=o.tc;en.r=o.r}dY.e[ei]=en;ei=null}else{dY.e.push(en);bump(n,a,lastCur,p,g,s,tt);await sv("freq",FQ)}
   await sm(ed);rIn()};
 if(E)$("#cex").onclick=()=>{ei=null;rIn()};
 document.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{dY.e.splice(+b.dataset.del,1);ei=null;await sm(ed);rIn()});
 document.querySelectorAll("[data-ex]").forEach(b=>b.onclick=()=>{ei=+b.dataset.ex;rIn();window.scrollTo(0,$("#en").getBoundingClientRect().top+scrollY-120)});
 document.querySelectorAll("[data-tt]").forEach(b=>b.onclick=async()=>{const x=dY.e[+b.dataset.tt];if(x.tt==="x")delete x.tt;else if(!x.tt)x.tt="x";await sm(ed);rIn()})}
async function rHi(m){m=m||TODAY.slice(0,7);const mo=await gm(m+"-01"),ds=Object.keys(mo.days).sort().reverse(),all=ds.flatMap(d=>mo.days[d].e);
 $("#hi").innerHTML=`<div class="cd"><h2>月份</h2><input type="month" id="hm" value="${m}"></div>
 <div class="cd"><h2>Tata 報銷(本月)</h2><div class="mu" style="font-size:14px">${ttTxt(ttSum(all))}</div><button class="btn g" id="ty">查看全年報銷</button><div id="tyr"></div></div>`+`<div class="cd"><h2>本月飲酒及煙(包括單內拆分)</h2><div class="mu" style="font-size:14px">飲酒:${gTxt(gSum(all,"飲酒"))}<br>煙:${gTxt(gSum(all,"煙"))}</div></div>`+(ds.map(d=>{const x=mo.days[d],v=cfg.items.filter(i=>x.v[i.id]!=null).map(i=>i.n.split("(")[0]+" "+(x.v[i.id]==="Y"?"有":x.v[i.id]==="N"?"沒有":x.v[i.id])).join("・");
 return`<div class="cd"><div class="it" style="border:0;padding:0"><b>${d}</b><span>${esc(tot(x.e))}</span></div><div class="mu">${x.e.length} 筆支出${v?" ・ "+esc(v):""}</div><button class="btn g" data-ed="${d}">編輯這一天</button></div>`}).join("")||'<div class="cd mu">這個月沒有記錄</div>');
 $("#hm").onchange=e=>rHi(e.target.value);document.querySelectorAll("[data-ed]").forEach(b=>b.onclick=()=>{ed=b.dataset.ed;ei=null;tab("in")});
 $("#ty").onclick=async()=>{const y=m.slice(0,4);let h=`<p class="mu">${y} 年</p>`;const yt=[];
  for(let i=1;i<=12;i++){const mm=y+"-"+pad(i),mo2=await gm(mm+"-01"),es=Object.values(mo2.days).flatMap(d=>d.e);yt.push(...es);const t=ttSum(es);if(Object.keys(t).length)h+=`<div class="it"><b>${i} 月</b><span style="text-align:right">${ttTxt(t)}</span></div>`}
  h+=`<div class="it"><b>全年</b><span style="text-align:right"><b>${ttTxt(ttSum(yt))}</b></span></div>`;$("#tyr").innerHTML=h}}

   else if(rts>lts){const o=JSON.parse(await DBX.down(k+".json"));await sv(k,o);if(k==="cfg")cfg=o;else{M[k]=o;if(!idx.includes(k)){idx.push(k);await sv("idx",{list:idx})}}dn++}
   if(n%10===0)msg("同步中… "+n+" / "+keys.length+"(上傳 "+up+",下載 "+dn+")")}
  DBX.st.last=new Date().toLocaleString();await DBX.save();msg("已同步 "+DBX.st.last+"(上傳 "+up+",下載 "+dn+")");if(dn&&$("#in").classList.contains("on"))rIn()}
 catch(e){msg("⚠ 同步失敗:"+(e&&e.message||e))}finally{busy=false}}
/* ---------- backup / import ---------- */
async function all(){for(const k of idx)if(!M[k])M[k]=await ld(k)||{days:{}};return{v:1,cfg,months:M}}
async function saveFile(name,text){const f=new File([text],name,{type:"application/json"});
 if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:name});return}catch(e){if(e&&e.name==="AbortError")return}}
 const a=document.createElement("a");a.href=URL.createObjectURL(f);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
async function imp(t){const s=$("#bs");let o;try{o=JSON.parse(t)}catch(e){s.textContent="檔案格式不正確";return}
 const lb=cfg.lb;if(o.cfg){cfg=o.cfg;cfg.lb=lb;await scfg()}const ks=Object.keys(o.months||{});let n=0;
 for(const k of ks){let m=o.months[k];if(idx.includes(k)){const ex=M[k]||await ld(k)||{days:{}};m.days=Object.assign({},ex.days,m.days)}m._ts=Date.now();M[k]=m;if(!idx.includes(k))idx.push(k);await sv(k,m);n++;if(n%10===0)s.textContent="匯入中… "+n+" / "+ks.length}
 await sv("idx",{list:idx});s.textContent="已匯入 "+n+" 個月份 ✓";sched(1000)}
function rBa(){const c=!!DBX.st.rt,lb=cfg.lb||"從未備份";
 $("#ba").innerHTML=`<div class="cd"><h2>Dropbox 同步</h2><p class="mu" id="dx">${c?"已連接。最後同步:"+esc(DBX.st.last||"尚未同步"):"尚未連接"}</p>
 ${c?`<button class="btn" id="sy">立即同步</button> <button class="btn g" id="dc">中斷連接</button>`:`<label>Dropbox App Key</label><input id="ak" value="${esc(DBX.st.key||"")}" autocapitalize="off" autocorrect="off"><p class="mu">要在 Dropbox 應用的 Redirect URIs 加入這個網址:<br><code>${esc(DBX.redirect())}</code></p><button class="btn" id="cn">連接 Dropbox</button>`}</div>
 <div class="cd"><h2>檔案備份</h2><p class="mu">上次檔案備份:${esc(lb)}</p><button class="btn" id="bx">備份成檔案</button> <span id="bk" class="mu"></span></div>
 <div class="cd"><h2>匯入備份</h2><p class="mu">選擇備份檔案(.json)。同一天的資料會被覆蓋,檔案沒有的日子會保留。</p><input type="file" id="bf" accept=".json,application/json"><p class="mu" id="bs"></p></div>
 ${matchMedia("(display-mode: standalone)").matches?"":`<div class="cd"><h2>安裝到主畫面</h2>${dp?`<button class="btn" id="ins">安裝</button>`:""}<p class="mu">如果沒有出現安裝畫面:Chrome 右上角選單 →「安裝並建立捷徑」。</p></div>`}`;
 if(c){$("#sy").onclick=()=>sync();$("#dc").onclick=async()=>{DBX.st.rt=DBX.st.at=null;await DBX.save();msg("已中斷 Dropbox 連接(本機數據保留)");rBa()}}
 else $("#cn").onclick=()=>{const k=$("#ak").value.trim();if(!k){$("#dx").textContent="請先輸入 App Key";return}DBX.connect(k)};
 $("#bx").onclick=async()=>{try{await saveFile("life-ledger-backup-"+TODAY+".json",JSON.stringify(await all()));cfg.lb=TODAY;await scfg();$("#bk").textContent="已備份 ✓"}catch(e){$("#bk").textContent="備份失敗:"+(e&&e.message||e)}};
 $("#bf").onchange=async e=>{const f=e.target.files[0];if(!f)return;$("#bs").textContent="讀取檔案…";try{await imp(await f.text())}catch(err){$("#bs").textContent="讀取失敗:"+(err&&err.message||err)}};
 if(dp)$("#ins").onclick=async()=>{dp.prompt();await dp.userChoice;dp=null;rBa()}}
function tab(t){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));
 document.querySelectorAll(".sec").forEach(s=>s.classList.toggle("on",s.id===t));({in:rIn,hi:()=>rHi(),se:rSe,ch:()=>rCh(),ba:rBa})[t]()}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>tab(b.dataset.t));
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();dp=e});
window.addEventListener("online",()=>sched(1000));
(async()=>{try{await DBX.load();const q=new URLSearchParams(location.search);
 if(q.get("code")){try{await DBX.finish(q.get("code"))}catch(e){msg("⚠ Dropbox 連接失敗:"+e.message)}history.replaceState(null,"",location.pathname)}
 else if(q.get("error")){msg("Dropbox 連接已取消");history.replaceState(null,"",location.pathname)}
 cfg=await ld("cfg")||JSON.parse(JSON.stringify(DEF));if(!cfg.cats)cfg.cats=JSON.parse(JSON.stringify(DEFCATS));const i=await ld("idx");idx=i&&i.list||[];FQ=await ld("freq")||{};
 if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
 if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
 if(!$("#st").textContent.startsWith("⚠"))msg(DBX.st.rt?"已連接 Dropbox":"資料存在這部手機(尚未連接 Dropbox)");
 await rIn();sched(0)}catch(e){msg("⚠ 啟動失敗:"+(e&&e.message||e))}})();
</script>
